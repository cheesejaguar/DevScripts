name: Cleanup Branches (Merged or Closed)

on:
  schedule:
    # Mon-Fri 03:00 UTC. Sat/Sun 03:00 UTC are inside the Shabbat union. LS-126.
    - cron: "0 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  shabbat-guard:
    uses: ./.github/workflows/shabbat-guard.yml
    permissions: {}

  cleanup:
    needs: shabbat-guard
    if: needs.shabbat-guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Recheck Shabbat window on the runner
        id: recheck
        shell: bash
        run: |
          # BEGIN SHABBAT_GUARD
          # Shabbat guard (LS-126). Backstop only: scheduled crons must already
          # avoid the window. This exits successfully and reports proceed=false if
          # America/Los_Angeles local time is inside [Fri 16:00, Sat 21:30).
          #
          # Always exits 0. Prints proceed=true|false to stdout and, when set, appends
          # the same to $GITHUB_OUTPUT so a job-level `if:` can skip later jobs.
          #
          # Fails closed: if tzdata is missing (offset is not -0700/-0800) or date
          # fails, it reports proceed=false and never judges the window in UTC.
          #
          # SHABBAT_GUARD_NOW, if set, is a timestamp interpreted in America/Los_Angeles.
          # Used only by tests. Accepts GNU date -d or BSD date -j.

          set -euo pipefail

          if [[ -n "${SHABBAT_GUARD_NOW:-}" ]]; then
            if date -d "${SHABBAT_GUARD_NOW}" +%s >/dev/null 2>&1; then
              mode=gnu
            elif date -j -f "%Y-%m-%d %H:%M:%S" "${SHABBAT_GUARD_NOW}" +%s >/dev/null 2>&1; then
              mode=bsd
            else
              echo "Shabbat guard: cannot parse SHABBAT_GUARD_NOW=${SHABBAT_GUARD_NOW}" >&2
              exit 1
            fi
          else
            mode=now
          fi

          # %u: 1=Mon ... 5=Fri 6=Sat 7=Sun. %H%M is always 4 zero-padded decimal digits.
          # %z is the local offset; -0700 (PDT) or -0800 (PST) proves tzdata resolved.
          # Branch the no-arg call so an empty array is never expanded under set -u (bash 3.2).
          fmt='dow=%u time=%H%M off=%z pretty=%Y-%m-%dT%H:%M:%S%z'
          case "$mode" in
            gnu) fields="$(TZ=America/Los_Angeles date -d "${SHABBAT_GUARD_NOW}" +"$fmt" 2>/dev/null)" || fields="" ;;
            bsd) fields="$(TZ=America/Los_Angeles date -j -f "%Y-%m-%d %H:%M:%S" "${SHABBAT_GUARD_NOW}" +"$fmt" 2>/dev/null)" || fields="" ;;
            *) fields="$(TZ=America/Los_Angeles date +"$fmt" 2>/dev/null)" || fields="" ;;
          esac

          dow="" time="" off="" pretty=""
          [[ -n "$fields" ]] && eval "$fields"

          if [[ -z "$fields" ]]; then
            echo "::warning::Shabbat guard: date failed; cannot resolve America/Los_Angeles. Failing closed (proceed=false); the window will not be judged in UTC."
            result=false
          elif [[ "$off" != "-0700" && "$off" != "-0800" ]]; then
            echo "::warning::Shabbat guard: America/Los_Angeles offset is '${off}', not -0700/-0800 (+0000 means tzdata is missing or date failed). Failing closed (proceed=false); the window will not be judged in UTC."
            result=false
          else
            skip=0
            # String compare on zero-padded HHMM. Sat 21:30 is the exclusive end.
            if [[ "$dow" == "5" && "$time" > "1559" ]]; then
              skip=1
            elif [[ "$dow" == "6" && "$time" < "2130" ]]; then
              skip=1
            fi

            if [[ "$skip" -eq 1 ]]; then
              echo "::warning::Shabbat guard: skipping work; local time is ${pretty} (America/Los_Angeles), inside Fri 16:00 to Sat 21:30 (end exclusive)."
              result=false
            else
              echo "Shabbat guard: proceeding; local time is ${pretty} (America/Los_Angeles)."
              result=true
            fi
          fi

          echo "proceed=${result}"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "proceed=${result}" >> "${GITHUB_OUTPUT}"
          fi
          exit 0
          # END SHABBAT_GUARD
      - name: Checkout repository
        if: steps.recheck.outputs.proceed == 'true'
        uses: actions/checkout@v5

      - name: Delete merged or closed branches older than 7 days
        if: steps.recheck.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CUTOFF_DATE=$(date -u -d "7 days ago" +%s)
          echo "Cutoff timestamp: $CUTOFF_DATE"

          # Get all existing branches (except protected ones)
          echo "Fetching existing branches..."
          EXISTING_BRANCHES=$(gh api repos/${{ github.repository }}/git/matching-refs/heads \
            --jq '.[].ref | ltrimstr("refs/heads/")' | grep -vE '^(main|master|develop)$' || true)

          if [ -z "$EXISTING_BRANCHES" ]; then
            echo "No branches to check."
            exit 0
          fi

          echo "Found $(echo "$EXISTING_BRANCHES" | wc -l) branches to check."

          # Get branches from merged/closed PRs older than 7 days
          echo "Fetching closed/merged PRs older than 7 days..."
          OLD_CLOSED_PR_BRANCHES=$(gh pr list \
            --state all \
            --base main \
            --json state,mergedAt,closedAt,headRefName,isCrossRepository \
            --limit 500 |
          jq -r --arg cutoff "$CUTOFF_DATE" '.[] |
            select(.isCrossRepository | not) |
            select(.state == "MERGED" or .state == "CLOSED") |
            select(((.mergedAt // .closedAt) | fromdateiso8601) < ($cutoff | tonumber)) |
            .headRefName' | sort -u)

          # Get branches with open PRs (never delete these)
          echo "Fetching branches with open PRs..."
          OPEN_PR_BRANCHES=$(gh pr list \
            --state open \
            --base main \
            --json headRefName \
            --limit 500 |
          jq -r '.[].headRefName' | sort -u)

          # Delete only branches that:
          # 1. Exist in repo
          # 2. Have a merged/closed PR older than 7 days
          # 3. Do NOT have an open PR
          for branch in $EXISTING_BRANCHES; do
            # Skip if branch has an open PR
            if echo "$OPEN_PR_BRANCHES" | grep -qx "$branch"; then
              echo "Skipping (open PR): $branch"
              continue
            fi
            # Only delete if branch has a closed/merged PR
            if echo "$OLD_CLOSED_PR_BRANCHES" | grep -qx "$branch"; then
              echo "Deleting branch: $branch (PR was merged/closed >7 days ago)"
              gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$branch \
                || echo "Failed to delete branch $branch"
            else
              echo "Skipping (no closed PR found): $branch"
            fi
          done

          echo "Cleanup complete."
