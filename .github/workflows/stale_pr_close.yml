name: Stale PR Management
on:
  schedule:
    # Mon-Fri 00:00 UTC. Sat/Sun 00:00 UTC are inside the Shabbat union. LS-126.
    - cron: "0 0 * * 1-5"
  workflow_dispatch:
  pull_request_target:
    types:
      - labeled

jobs:
  shabbat-guard:
    uses: ./.github/workflows/shabbat-guard.yml
    permissions: {}

  stale-prs:
    needs: shabbat-guard
    if: needs.shabbat-guard.outputs.proceed == 'true'
    runs-on: self-hosted
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - name: Recheck Shabbat window on the runner
        id: recheck
        shell: bash
        run: |
          # BEGIN SHABBAT_GUARD
          # Shabbat guard (LS-126). Backstop only: scheduled crons must already
          # avoid the window. This exits successfully and reports proceed=false if
          # America/Los_Angeles local time is inside [Fri 16:00, Sat 21:30).
          #
          # Always exits 0. Prints proceed=true|false to stdout and, when set, appends
          # the same to $GITHUB_OUTPUT so a job-level `if:` can skip later jobs.
          #
          # Fails closed: if tzdata is missing (offset is not -0700/-0800) or date
          # fails, it reports proceed=false and never judges the window in UTC.
          #
          # SHABBAT_GUARD_NOW, if set, is a timestamp interpreted in America/Los_Angeles.
          # Used only by tests. Accepts GNU date -d or BSD date -j.

          set -euo pipefail

          if [[ -n "${SHABBAT_GUARD_NOW:-}" ]]; then
            if date -d "${SHABBAT_GUARD_NOW}" +%s >/dev/null 2>&1; then
              mode=gnu
            elif date -j -f "%Y-%m-%d %H:%M:%S" "${SHABBAT_GUARD_NOW}" +%s >/dev/null 2>&1; then
              mode=bsd
            else
              echo "Shabbat guard: cannot parse SHABBAT_GUARD_NOW=${SHABBAT_GUARD_NOW}" >&2
              exit 1
            fi
          else
            mode=now
          fi

          # %u: 1=Mon ... 5=Fri 6=Sat 7=Sun. %H%M is always 4 zero-padded decimal digits.
          # %z is the local offset; -0700 (PDT) or -0800 (PST) proves tzdata resolved.
          # Branch the no-arg call so an empty array is never expanded under set -u (bash 3.2).
          fmt='dow=%u time=%H%M off=%z pretty=%Y-%m-%dT%H:%M:%S%z'
          case "$mode" in
            gnu) fields="$(TZ=America/Los_Angeles date -d "${SHABBAT_GUARD_NOW}" +"$fmt" 2>/dev/null)" || fields="" ;;
            bsd) fields="$(TZ=America/Los_Angeles date -j -f "%Y-%m-%d %H:%M:%S" "${SHABBAT_GUARD_NOW}" +"$fmt" 2>/dev/null)" || fields="" ;;
            *) fields="$(TZ=America/Los_Angeles date +"$fmt" 2>/dev/null)" || fields="" ;;
          esac

          dow="" time="" off="" pretty=""
          [[ -n "$fields" ]] && eval "$fields"

          if [[ -z "$fields" ]]; then
            echo "Shabbat guard: date failed; cannot resolve America/Los_Angeles. Failing closed (proceed=false); the window will not be judged in UTC."
            result=false
          elif [[ "$off" != "-0700" && "$off" != "-0800" ]]; then
            echo "Shabbat guard: America/Los_Angeles offset is '${off}', not -0700/-0800 (+0000 means tzdata is missing or date failed). Failing closed (proceed=false); the window will not be judged in UTC."
            result=false
          else
            skip=0
            # String compare on zero-padded HHMM. Sat 21:30 is the exclusive end.
            if [[ "$dow" == "5" && "$time" > "1559" ]]; then
              skip=1
            elif [[ "$dow" == "6" && "$time" < "2130" ]]; then
              skip=1
            fi

            if [[ "$skip" -eq 1 ]]; then
              echo "Shabbat guard: skipping work; local time is ${pretty} (America/Los_Angeles), inside Fri 16:00 to Sat 21:30 (end exclusive)."
              result=false
            else
              echo "Shabbat guard: proceeding; local time is ${pretty} (America/Los_Angeles)."
              result=true
            fi
          fi

          echo "proceed=${result}"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "proceed=${result}" >> "${GITHUB_OUTPUT}"
          fi
          exit 0
          # END SHABBAT_GUARD
      - name: Handle stale PRs
        if: steps.recheck.outputs.proceed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const now = new Date();
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const REQ = "requirements missing";
            const MAINTAINERS = ["OWNER", "MEMBER", "COLLABORATOR"];
            const days = d => (now - d) / (1000 * 60 * 60 * 24);
            const staleNotice = author =>
              `@${author} This PR has been marked as stale. It will be closed if no new commits are added in 7 days.`;

            // Only fires for a maintainer's label: labels set with GITHUB_TOKEN raise no event.
            if (context.eventName === "pull_request_target" && context.payload.action === "labeled") {
              const pr = context.payload.pull_request;
              const labels = (pr.labels || []).map(l => l.name);
              if (context.payload.label?.name === "stale" && !labels.includes(REQ)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number, body: staleNotice(pr.user.login)
                });
              }
              return;
            }

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name);
              const author = pr.user.login;
              const hasStale = labels.includes("stale");

              if (labels.includes("keep-open")) {
                if (hasStale) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                }
                continue;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              const lastCommitDate = commits.length > 0
                ? new Date(commits[commits.length - 1].commit.author.date)
                : new Date(pr.created_at);
              const humanComments = comments.filter(c => c.user?.type !== "Bot");

              // -------------------------------------------------------
              // Auto-label PRs with no activity in the last 14 days,
              // but ONLY if someone other than the author has engaged.
              // -------------------------------------------------------
              if (!hasStale) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: pr.number, per_page: 100
                });
                const engaged =
                  reviews.some(r => r.user?.type !== "Bot" && r.user?.login !== author) ||
                  humanComments.some(c => c.user?.login !== author);
                if (!engaged) continue;

                const lastCommentDate = humanComments.length > 0
                  ? new Date(humanComments[humanComments.length - 1].created_at)
                  : null;
                const lastActivityDate = lastCommentDate && lastCommentDate > lastCommitDate
                  ? lastCommentDate
                  : lastCommitDate;

                if (days(lastActivityDate) > 14) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["stale"] });
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: staleNotice(author) });
                }
                continue;
              }

              // -------------------------------------------------------
              // Manage already-stale PRs
              // -------------------------------------------------------
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              const staleDates = events
                .filter(e => e.event === "labeled" && e.label?.name === "stale")
                .map(e => new Date(e.created_at));
              if (staleDates.length === 0) continue;
              const staleLabelDate = new Date(Math.max(...staleDates));
              const isRequirements = labels.includes(REQ);

              // A push ends an inactivity mark; a requirements mark only ends via unmet-pr-close.yml.
              if (!isRequirements && lastCommitDate > staleLabelDate) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "stale" });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `@${author} Recent activity detected. Removing stale label.`
                });
                continue;
              }

              // A maintainer comment after the mark restarts the 7 days.
              const maintainerDates = humanComments
                .filter(c => MAINTAINERS.includes(c.author_association) && c.user?.login !== author)
                .map(c => new Date(c.created_at))
                .filter(d => d > staleLabelDate);
              const clockStart = maintainerDates.length > 0 ? new Date(Math.max(...maintainerDates)) : staleLabelDate;
              if (days(clockStart) <= 7) continue;

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: isRequirements
                  ? `@${author} Closing: the items from the requirements check above were still missing 7 days later. Once they are in place, please open a new pull request.`
                  : `@${author} Closing stale PR due to inactivity (no commits for 7 days after stale label).`
              });
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: "closed" });
            }
